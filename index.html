<<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Housing Price Index</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 0; background: #f8f9fa; }
    header { background: #1e293b; color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
    nav a { color: #cbd5e1; text-decoration: none; margin-left: 1.5rem; font-weight: bold; }
    nav a:hover { color: white; }
    main { max-width: 1000px; margin: 2rem auto; padding: 0 1rem; }
    .card { background: white; border-radius: 8px; padding: 1.5rem; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .chart-box { position: relative; height: 450px; width: 100%; margin-top: 1rem; }
  </style>
</head>
<body>
  <header>
    <h2>Housing Price Index</h2>
    <nav>
      <a href="index.html">Home</a>
      <a href="exploration.html">Exploration</a>
      <a href="story.html">Story</a>
    </nav>
  </header>
  <main>
    <div class="card">
      <h1 id="status">Loading thousands of observations...</h1>
      <p>This graph plots decades of house price index trends from over 100,000 data points.</p>
      <div class="chart-box">
        <canvas id="heroChart"></canvas>
      </div>
    </div>
  </main>
  <script>
    Papa.parse('data/hpi_master.csv', {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: function(results) {
        document.getElementById('status').innerText = "U.S. House Price Index Trends (1975–Present)";
        const points = results.data
          .filter(d => d.level === 'State' && d.index_nsa)
          .map(d => ({ x: parseInt(d.yr) + (parseInt(d.period) - 1) / 4, y: parseFloat(d.index_nsa) }))
          .filter(pt => !isNaN(pt.x) && !isNaN(pt.y));

        new Chart(document.getElementById('heroChart').getContext('2d'), {
          type: 'scatter',
          data: {
            datasets: [{
              label: 'State Housing Index',
              data: points,
              backgroundColor: 'rgba(37, 99, 235, 0.25)',
              pointRadius: 2.5
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              x: { title: { display: true, text: 'Year' } },
              y: { title: { display: true, text: 'House Price Index' } }
            }
          }
        });
      }
    });
  </script>
</body>
</html>
